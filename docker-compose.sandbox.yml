name: matcha-agent-sandbox

services:
  workspace:
    # Project namespaces isolate containers and state volumes, but both the
    # interactive and AutoPR lanes reuse this large, pinned toolchain image.
    # Without an explicit name Compose would build a duplicate 7+ GB image for
    # every dedicated project name.
    image: ${SANDBOX_IMAGE:-matcha-agent-sandbox-workspace:latest}
    build:
      # Installed msandbox releases keep their Compose templates immutable,
      # while the build context remains the selected Matcha checkout.
      context: ${SANDBOX_BUILD_CONTEXT:-.}
      dockerfile: ${SANDBOX_DOCKERFILE:-docker/agent-sandbox/Dockerfile}
      args:
        INSTALL_PLAYWRIGHT_BROWSERS: ${INSTALL_PLAYWRIGHT_BROWSERS:-false}
        DEPENDENCY_TEMPLATE_ID: ${SANDBOX_DEPENDENCY_TEMPLATE_ID:-legacy}
        USER_UID: ${SANDBOX_UID:-501}
        USER_GID: ${SANDBOX_GID:-20}
    init: true
    working_dir: /workspace
    environment:
      HOME: /home/agent
      GIT_CONFIG_GLOBAL: /home/agent/.config/git/config
      AGENT_SANDBOX: "1"
      AWS_REGION: ${AWS_REGION:-us-west-1}
      LOCAL_PORT: ${HOST_DB_PORT:-5432}
      REDIS_PORT: ${HOST_REDIS_PORT:-6380}
      # Agent shells must not use the repo's host-oriented localhost URLs:
      # inside this container, localhost is the workspace itself. Export the
      # Docker Desktop gateway URLs so every CLI and subprocess sees the
      # normal local dev services without needing sandbox-specific knowledge.
      DATABASE_URL: postgresql://matcha:matcha_dev@host.docker.internal:${HOST_DB_PORT:-5432}/matcha
      REDIS_URL: redis://host.docker.internal:${HOST_REDIS_PORT:-6380}/0
      # The host-run dev stack keeps the canonical localhost ports. These
      # explicit gateway URLs let browser/tests inside the container exercise
      # that same stack while preserving Docker's network namespace.
      HOST_DEV_BACKEND_URL: http://host.docker.internal:${HOST_DEV_BACKEND_PORT:-8001}
      HOST_DEV_FRONTEND_URL: http://host.docker.internal:${HOST_DEV_FRONTEND_PORT:-5174}
      HOST_DEV_TELLUS_URL: http://host.docker.internal:${HOST_DEV_TELLUS_PORT:-5191}
      HOST_DEV_OCEANLAB_URL: http://host.docker.internal:${HOST_DEV_OCEANLAB_PORT:-5201}
      BACKEND_PORT: ${BACKEND_PORT:-8001}
      FRONTEND_PORT: ${FRONTEND_PORT:-5174}
      TELLUS_PORT: ${TELLUS_PORT:-5191}
      OCEANLAB_PORT: ${OCEANLAB_PORT:-5201}
      CHAT_PORT: ${CHAT_PORT:-8080}
    volumes:
      # AutoPR overrides this with a clean tracked-files-only clone. Ordinary
      # interactive msandbox sessions still default to the repository root.
      - ${SANDBOX_WORKSPACE_DIR:-.}:/workspace
      - sandbox_home:/home/agent
      - sandbox_npm_cache:/home/agent/.npm
      # AWS static credentials, read-only. See docs/ops/AGENT_SANDBOX.md's
      # threat model — this is deliberately reachable, not an oversight.
      # AutoPR points this at an empty directory. Interactive sessions retain
      # the documented read-only host AWS mount by default.
      - ${SANDBOX_AWS_DIR:-${HOME}/.aws}:/home/agent/.aws:ro
      - sandbox_server_venv:/workspace/server/venv
      - sandbox_client_node_modules:/workspace/client/node_modules
      - sandbox_tellus_node_modules:/workspace/client/tellus/node_modules
      - sandbox_oceanlab_node_modules:/workspace/client/oceanlab/node_modules
    ports:
      # Keep the host's canonical dev-remote.sh ports free. Processes inside
      # this container still use the normal ports; only their Mac-facing
      # publications move into a dedicated +10000 sandbox range.
      - "127.0.0.1:${SANDBOX_HOST_BACKEND_PORT:-18001}:${BACKEND_PORT:-8001}"
      - "127.0.0.1:${SANDBOX_HOST_FRONTEND_PORT:-15174}:${FRONTEND_PORT:-5174}"
      - "127.0.0.1:${SANDBOX_HOST_TELLUS_PORT:-15191}:${TELLUS_PORT:-5191}"
      - "127.0.0.1:${SANDBOX_HOST_OCEANLAB_PORT:-15201}:${OCEANLAB_PORT:-5201}"
      - "127.0.0.1:${SANDBOX_HOST_CHAT_PORT:-18080}:${CHAT_PORT:-8080}"
    read_only: true
    tmpfs:
      # OpenCode's OpenTUI renderer extracts a versioned native library under
      # /tmp and maps it executable. The agent can already execute code from
      # /workspace and its isolated home, so noexec only breaks the supported
      # CLI without strengthening the container boundary.
      - /tmp:rw,exec,nosuid,size=1g
      - /run:rw,nosuid,size=16m
    cap_drop:
      - ALL
    # Required only for the root entrypoint to initialize named dependency
    # volumes, then gosu drops to the dedicated `agent` user before commands.
    # DAC_OVERRIDE and FOWNER matter specifically because rsync -a's archive
    # mode preserves the source's ownership+timestamps as it copies: it
    # chowns each new file/dir to agent:agent (CHOWN) as it goes, then needs
    # to keep writing into now-non-root-owned dirs (DAC_OVERRIDE) and set
    # timestamps on now-non-root-owned files (FOWNER) to finish the copy.
    # None of this widens the actual security boundary (no docker.sock, no
    # host paths outside the repo) — it only affects permission checks on
    # paths already inside the container.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    command: ["sleep", "infinity"]

volumes:
  sandbox_home:
  sandbox_npm_cache:
  # Session controllers provide content-addressed names. Legacy callers keep
  # the existing shared defaults, avoiding a multi-gigabyte copy per session.
  sandbox_server_venv:
    name: ${SANDBOX_SERVER_VENV_VOLUME:-matcha-agent-sandbox_sandbox_server_venv}
  sandbox_client_node_modules:
    name: ${SANDBOX_CLIENT_NODE_MODULES_VOLUME:-matcha-agent-sandbox_sandbox_client_node_modules}
  sandbox_tellus_node_modules:
    name: ${SANDBOX_TELLUS_NODE_MODULES_VOLUME:-matcha-agent-sandbox_sandbox_tellus_node_modules}
  sandbox_oceanlab_node_modules:
    name: ${SANDBOX_OCEANLAB_NODE_MODULES_VOLUME:-matcha-agent-sandbox_sandbox_oceanlab_node_modules}
