name: matcha-agent-sandbox

services:
  workspace:
    build:
      context: .
      dockerfile: docker/agent-sandbox/Dockerfile
      args:
        INSTALL_PLAYWRIGHT_BROWSERS: ${INSTALL_PLAYWRIGHT_BROWSERS:-false}
        USER_UID: ${SANDBOX_UID:-501}
        USER_GID: ${SANDBOX_GID:-20}
    init: true
    working_dir: /workspace
    environment:
      HOME: /home/agent
      GIT_CONFIG_GLOBAL: /home/agent/.config/git/config
      AGENT_SANDBOX: "1"
      AWS_REGION: ${AWS_REGION:-us-west-1}
      LOCAL_PORT: ${HOST_DB_PORT:-5432}
      REDIS_PORT: ${HOST_REDIS_PORT:-6380}
      BACKEND_PORT: ${BACKEND_PORT:-8001}
      FRONTEND_PORT: ${FRONTEND_PORT:-5174}
      TELLUS_PORT: ${TELLUS_PORT:-5191}
      OCEANLAB_PORT: ${OCEANLAB_PORT:-5201}
      CHAT_PORT: ${CHAT_PORT:-8080}
    volumes:
      - .:/workspace
      - sandbox_home:/home/agent
      - sandbox_npm_cache:/home/agent/.npm
      # AWS static credentials, read-only. See docs/ops/AGENT_SANDBOX.md's
      # threat model — this is deliberately reachable, not an oversight.
      - ${HOME}/.aws:/home/agent/.aws:ro
      - sandbox_server_venv:/workspace/server/venv
      - sandbox_client_node_modules:/workspace/client/node_modules
      - sandbox_tellus_node_modules:/workspace/client/tellus/node_modules
      - sandbox_oceanlab_node_modules:/workspace/client/oceanlab/node_modules
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
      - "127.0.0.1:${FRONTEND_PORT:-5174}:${FRONTEND_PORT:-5174}"
      - "127.0.0.1:${TELLUS_PORT:-5191}:${TELLUS_PORT:-5191}"
      - "127.0.0.1:${OCEANLAB_PORT:-5201}:${OCEANLAB_PORT:-5201}"
      - "127.0.0.1:${CHAT_PORT:-8080}:${CHAT_PORT:-8080}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /run:rw,nosuid,size=16m
    cap_drop:
      - ALL
    # Required only for the root entrypoint to initialize named dependency
    # volumes, then gosu drops to the dedicated `agent` user before commands.
    # DAC_OVERRIDE and FOWNER matter specifically because rsync -a's archive
    # mode preserves the source's ownership+timestamps as it copies: it
    # chowns each new file/dir to agent:agent (CHOWN) as it goes, then needs
    # to keep writing into now-non-root-owned dirs (DAC_OVERRIDE) and set
    # timestamps on now-non-root-owned files (FOWNER) to finish the copy.
    # None of this widens the actual security boundary (no docker.sock, no
    # host paths outside the repo) — it only affects permission checks on
    # paths already inside the container.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    command: ["sleep", "infinity"]

volumes:
  sandbox_home:
  sandbox_npm_cache:
  sandbox_server_venv:
  sandbox_client_node_modules:
  sandbox_tellus_node_modules:
  sandbox_oceanlab_node_modules:
