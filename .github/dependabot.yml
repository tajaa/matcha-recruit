version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    # Every workflow SHA-pins its actions; dependabot bumps the SHA and keeps
    # the version comment, so the pins stay honest without hand-editing.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    open-pull-requests-limit: 5
    # requirements.txt is `>=` floors with no lockfile, and the image installs
    # whatever is current at build time — so the default strategy's
    # "raise the floor on every release" PRs changed nothing. Only open a PR
    # when a constraint actually blocks the new version (a `<N.0.0` cap).
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Browser revisions are per-playwright-version and server/Dockerfile's
      # base stage pins ARG PLAYWRIGHT_VERSION to match — bump both by hand.
      - dependency-name: playwright

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, frontend]
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Majors get their own PR each and need a human (TypeScript 7, jsdom 30
    # needing Node 22, react-simple-maps 5's API — all landed while checks
    # was red). Bump them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client/tellus
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, tellus]
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client/oceanlab
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, oceanlab]
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /server/agent-ui
    schedule:
      interval: monthly
    labels: [dependencies, agent]
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
