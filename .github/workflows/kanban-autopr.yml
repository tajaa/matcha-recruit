name: Kanban autopr

on:
  workflow_dispatch:

# This must run on Finch's Mac. The trusted job owns board/prod/GitHub access,
# while Codex runs with broad permissions only inside a dedicated msandbox
# containing a clean tracked-files-only clone. The Matcha bot credential lives
# in ~/.config/matcha-autopr/env
# (chmod 600, never committed, never a GitHub secret) — same design
# constraint as silent-error-autofix.yml. The trusted harness reads the active
# production image identities, migration revisions, and redacted error evidence;
# it never writes prod Postgres and removes SSH from the model environment. Board
# reads/writes use HTTPS as the bot. The concurrency group collapses queued ticks
# while the one-slot Mac runner is busy. The local LaunchAgent is the only
# automatic clock; keeping a second GitHub cron would leave a check/dispatch
# race that can queue a duplicate run.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kanban-autopr
  cancel-in-progress: false

# Keep the review queue bounded, but let the one-minute runner make progress
# across the four supported projects instead of idling after only three drafts.
# `select.sh` carries the same value as its safe local/dashboard default.
env:
  MAX_OPEN_IMPLEMENTATION_PRS: 10

jobs:
  build:
    runs-on: [self-hosted, macOS, opencode]
    # Leave headroom around the bounded investigation for validation and publishing.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This self-hosted runner's client/node_modules is pre-installed
          # and persists between runs — verify.sh symlinks it into the
          # baseline worktree read-only rather than running `npm ci` here.
          # The default `clean: true` runs `git clean -ffdx` before checkout,
          # which wipes that gitignored directory every run and silently
          # disables client verification (CLIENT_DEPS_READY always false).
          clean: false

      - name: Require msandbox master switch
        run: |
          if ! ./scripts/agent-sandbox.sh autopr-ready; then
            echo "AutoPR is disabled. Start it explicitly with: msandbox start" >&2
            exit 1
          fi

      - name: Refuse a hot re-dispatch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Mac dispatcher is supposed to hold this lane to one pass per
          # twenty minutes; a stale installed copy re-fired it every 66 s for
          # hours. This floor lives on GitHub's side so no local clock bug can
          # spin the runner again. API failure proceeds (spend guard only).
          set +e
          ./scripts/kanban-autopr/hot-redispatch-guard.sh
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "Previous Kanban run completed less than five minutes ago; skipping this pass." >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reset any stray bot branch or leftover model edits from a prior interrupted run
        run: |
          git worktree list --porcelain | awk '/^branch refs\/heads\/bot\/task-/{print}' || true
          git worktree prune
          # `clean: false` keeps node_modules, so the checkout persists between
          # runs — and so does anything a killed run left in the tree. Model
          # edits that survived here were staged into the NEXT card's PR by
          # publish.sh's `git add --all`. Tracked changes and untracked files
          # go; ignored paths (node_modules, venv, .env) are untouched.
          git reset --hard HEAD
          git clean -fd
          current="$(git branch --show-current)"
          if [[ "$current" == bot/task-* ]]; then
            git switch main
          fi
          # Everything downstream reads the LOCAL main: `git archive main`
          # builds the control plane, `git switch -C "$branch" main` bases the
          # draft, and resolve-production-context.sh gates the deployed SHA
          # against origin/main. This persistent clone's main lags whatever was
          # last checked out here, so without the fast-forward a commit that is
          # deployed and in origin/main can be absent from the branch the bot
          # drafts on — the gate passes while the invariant it protects does
          # not hold. The clone is disposable; a diverged local main is
          # leftover bot state, not work to preserve.
          git fetch --quiet origin main
          if [ "$(git branch --show-current)" = main ]; then
            git merge --ff-only origin/main || git reset --hard origin/main
          else
            git fetch --quiet --force origin main:main
          fi

      - name: Configure GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Ensure labels exist
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One list call instead of twelve creates on every no-op pass. Read
          # color and description too: `gh label create --force` is the only
          # thing that UPDATES an existing label, so a name-only skip meant an
          # edited description or color here could never reach the repo.
          existing="$(gh label list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json name,color,description \
            --jq '.[] | "\(.name)|\(.color | ascii_downcase)|\(.description // "")"' 2>/dev/null || true)"
          for l in "autopr|1D76DB|Opened by the kanban-autopr bot" \
                   "autopr-rework|8250DF|Pushed to address review feedback on an existing autopr PR" \
                   "autopr-awaiting-input|5319E7|Draft needs a human answer before automation can continue" \
                   "criticality:red|B60205|Production, safety, security, data, or compliance critical" \
                   "criticality:orange|D93F0B|Material regression or broad workflow impact" \
                   "criticality:yellow|FBCA04|Scoped feature, UX, or workaround-available work" \
                   "confidence:high|0E8A16|Autopr confidence 75-100" \
                   "confidence:medium|FBCA04|Autopr confidence 45-74" \
                   "confidence:low|D93F0B|Autopr confidence 0-44" \
                   "covers-kanban-task|0E8A16|Also covers a Matcha Work task" \
                   "possible-duplicate|FBCA04|May overlap another open pull request" \
                   "needs-work|D93F0B|Verification found a new failure, or could not run"; do
            IFS='|' read -r name color desc <<< "$l"
            printf '%s\n' "$existing" \
              | grep -qxF "$name|$(printf '%s' "$color" | tr 'A-Z' 'a-z')|$desc" && continue
            gh label create "$name" --color "$color" --description "$desc" --force >/dev/null 2>&1 || true
          done

      - name: Collect candidate cards
        id: collect
        if: steps.guard.outputs.proceed == 'true'
        timeout-minutes: 2
        run: ./scripts/kanban-autopr/collect.sh > "$RUNNER_TEMP/cards.json"

      - name: Collect open bot PR context
        if: steps.guard.outputs.proceed == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One run-scoped snapshot of every open bot PR. The reconciler, the
          # planner, and the selector all read this file instead of each
          # re-querying GitHub for the same PRs.
          ./scripts/kanban-autopr/collect-pr-context.sh > "$RUNNER_TEMP/bot-prs.json"
          echo "AUTOPR_BOT_PRS_FILE=$RUNNER_TEMP/bot-prs.json" >> "$GITHUB_ENV"

      - name: Reconcile merged or closed PR cards missed by the webhook
        if: steps.guard.outputs.proceed == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub delivery is the fast path; this is the one-minute repair
          # path. It also removes repaired cards from this run's candidate
          # snapshot, preventing a duplicate PR before the next collection.
          ./scripts/kanban-autopr/reconcile-merged-cards.sh "$RUNNER_TEMP/cards.json" \
            > "$RUNNER_TEMP/reconciled-cards.json"
          mv "$RUNNER_TEMP/reconciled-cards.json" "$RUNNER_TEMP/cards.json"

      - name: Build cross-card and bot-PR work plan
        if: steps.guard.outputs.proceed == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Comments/reviews from all three bot lanes are bounded, untrusted
          # planning evidence. plan.py clusters related cards, excludes PRs
          # already marked ready for review, and assigns the proposed merge
          # order for the remaining drafts.
          python3 ./scripts/kanban-autopr/plan.py \
            --cards "$RUNNER_TEMP/cards.json" \
            --prs "$RUNNER_TEMP/bot-prs.json" \
            --output "$RUNNER_TEMP/plan.json" \
            --cards-output "$RUNNER_TEMP/planned-cards.json"
          mv "$RUNNER_TEMP/planned-cards.json" "$RUNNER_TEMP/cards.json"
          {
            echo '## AutoPR work and merge plan'
            jq '{plan_id, work_order, merge_order, ready_prs_excluded, release_blockers}' "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select one card
        id: select
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./scripts/kanban-autopr/select.sh "$RUNNER_TEMP/cards.json" > "$RUNNER_TEMP/card.json"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "Nothing to build this run." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "id8=$(jq -r '.id8' "$RUNNER_TEMP/card.json")" >> "$GITHUB_OUTPUT"
            echo "mode=$(jq -r '.mode' "$RUNNER_TEMP/card.json")" >> "$GITHUB_OUTPUT"
            # pull_request | artifact, from the kind registry. The PR-only
            # steps below key on this rather than on a mode name, so a new
            # artifact kind is a registry row plus a publisher and never
            # falls through into branch creation or publish.sh.
            echo "outcome=$(jq -r '.outcome // "pull_request"' "$RUNNER_TEMP/card.json")" >> "$GITHUB_OUTPUT"
          fi

      # Production resolution (SSH + two ECR lookups + a curl of the frontend
      # bundle) is the most expensive prelude step and its result is only
      # ever read once a card is selected. ≥96% of runs select nothing.
      - name: Write production SSH key
        if: steps.select.outputs.skip == 'false'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/matcha-prod.pem"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/matcha-prod.pem"

      - name: Resolve active production build and schema
        if: steps.select.outputs.skip == 'false'
        timeout-minutes: 3
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
        run: |
          ./scripts/kanban-autopr/resolve-production-context.sh > "$RUNNER_TEMP/production-context.json"
          {
            echo '## Production baseline'
            jq '{build_number, release_sha, containers: {backend: .containers.backend.git_sha, frontend: .containers.frontend.git_sha}, database}' "$RUNNER_TEMP/production-context.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq --slurpfile production "$RUNNER_TEMP/production-context.json" \
            '. + {production: $production[0]}' "$RUNNER_TEMP/card.json" \
            > "$RUNNER_TEMP/card-with-production.json"
          mv "$RUNNER_TEMP/card-with-production.json" "$RUNNER_TEMP/card.json"

      - name: Snapshot trusted AutoPR control plane
        if: steps.select.outputs.skip == 'false'
        run: |
          # Everything that runs AFTER the model has touched the workspace
          # executes from this copy of main, never from the checkout. The
          # scope checker and lib.sh's migration-graph helper were missing
          # from the archive (lib.sh resolves ../alembic_graph_snapshot.py
          # relative to itself, so every migration draft failed its check
          # from the control root). agent-sandbox.sh stays in the workspace:
          # it resolves compose files and the msandbox package from its own
          # location, and the bridge's apply-time denylist now guarantees a
          # model patch cannot reach scripts/, docker/, or compose files.
          control_root="$RUNNER_TEMP/autopr-control"
          rm -rf "$control_root"
          mkdir -p "$control_root"
          git archive main scripts/kanban-autopr scripts/error-autofix scripts/autopr-scope \
              scripts/alembic_graph_snapshot.py scripts/alembic_graph.py \
            | tar -x -C "$control_root"
          echo "AUTOPR_CONTROL_ROOT=$control_root/scripts" >> "$GITHUB_ENV"
          echo "AUTOPR_WORKSPACE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "AUTOPR_SANDBOX_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Resolve investigation runtime approval
        id: runtime
        if: steps.select.outputs.skip == 'false'
        timeout-minutes: 2
        run: |
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/runtime-policy.sh" \
            "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/runtime-policy.json"
          echo "minutes=$(jq -r '.minutes' "$RUNNER_TEMP/runtime-policy.json")" >> "$GITHUB_OUTPUT"
          jq '{minutes,extended,checkpoint,approval_event_id:.source_event_id}' \
            "$RUNNER_TEMP/runtime-policy.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or check out task branch
        id: branch
        # Artifact kinds own no branch: the run stays on main and the
        # deliverable is attached to the card instead of a PR.
        if: steps.select.outputs.skip == 'false' && steps.select.outputs.outcome != 'artifact'
        env:
          MODE: ${{ steps.select.outputs.mode }}
          ID8: ${{ steps.select.outputs.id8 }}
        run: |
          git worktree prune
          branch="bot/task-$ID8"
          if [ "$MODE" = rework ]; then
            # The runner's workspace persists between runs, so a local
            # `$branch` may already exist from a prior investigation. Plain
            # `git switch "$branch"` would check that stale local ref out
            # unchanged (no fast-forward) — publish.sh's --force-with-lease
            # then compares against the freshly fetched origin ref, the
            # lease passes, and any reviewer commit pushed to the PR in the
            # meantime gets silently force-pushed away. Force the local
            # branch to match origin exactly instead.
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            # A draft can predate the current automation harness and product
            # tree. Bring it forward before investigation so its PR diff does
            # not accidentally include deletions from a stale base.
            git config user.name "matcha-kanban-autopr"
            git config user.email "matcha-kanban-autopr@users.noreply.github.com"
            if ! git merge --no-edit main; then
              git merge --abort || true
              exit 1
            fi
          else
            git switch -C "$branch" main
          fi
          echo "sha=$(git merge-base HEAD main)" >> "$GITHUB_OUTPUT"

      - name: Investigate
        id: investigate
        if: steps.select.outputs.skip == 'false'
        timeout-minutes: ${{ fromJSON(steps.runtime.outputs.minutes || '20') }}
        continue-on-error: true
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
          # Fail closed into the dedicated container/volume namespace. The
          # helper also mounts an empty AWS directory and never passes this
          # step's GitHub, Matcha, or production credentials through.
          AUTOPR_MSANDBOX_BIN: ${{ github.workspace }}/scripts/agent-sandbox.sh
          AUTOPR_SANDBOX_PROJECT_NAME: matcha-kanban-autopr-sandbox
          # One resolution of the owner's directives for the whole run: the
          # budgeted runtime and the authority in the model's prompt must not
          # come from two different reads of the board history.
          AUTOPR_DIRECTIVE_POLICY_FILE: ${{ runner.temp }}/runtime-policy.json
          AUTOPR_INVESTIGATION_EXIT_FILE: ${{ runner.temp }}/investigation-exit-code
          # Where a browsing research run leaves the screenshots the trusted
          # bridge admitted. Empty on every other kind of run.
          AUTOPR_ARTIFACTS_OUTPUT_DIR: ${{ runner.temp }}/research-artifacts
        run: |
          date +%s > "$RUNNER_TEMP/investigation-started-at"
          rm -rf "$RUNNER_TEMP/research-artifacts"
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/investigate.sh" "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/decision.json"

      - name: Checkpoint interrupted investigation
        id: checkpoint
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome != 'success'
        timeout-minutes: 2
        continue-on-error: true
        env:
          AUTOPR_MSANDBOX_BIN: ${{ github.workspace }}/scripts/agent-sandbox.sh
          AUTOPR_SANDBOX_PROJECT_NAME: matcha-kanban-autopr-sandbox
          # Present only if investigate.sh exited on its own. Its absence is
          # what distinguishes a real timeout (pause the card for approval)
          # from a crash (fail the run, leave the card selectable).
          AUTOPR_INVESTIGATION_EXIT_FILE: ${{ runner.temp }}/investigation-exit-code
        run: |
          started_at="$(cat "$RUNNER_TEMP/investigation-started-at" 2>/dev/null || date +%s)"
          checkpoint="$($AUTOPR_CONTROL_ROOT/kanban-autopr/checkpoint.sh save \
            "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/decision.json" \
            "$started_at" "${{ steps.runtime.outputs.minutes || '20' }}")"
          echo "path=$checkpoint" >> "$GITHUB_OUTPUT"
          {
            echo "## Interrupted investigation checkpoint"
            jq . "$checkpoint/metadata.json"
            echo
            echo "Stored locally on the trusted runner; partial model output was not uploaded to GitHub."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail incomplete investigation
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome != 'success'
        run: |
          # Partial work is already safe in the local checkpoint.
          git reset --hard HEAD
          git clean -fd
          echo "Investigation failed before producing a valid report. Any partial output was checkpointed before cleanup." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Read validated triage decision
        id: triage
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success'
        run: |
          outcome="$(jq -r '.outcome' "$RUNNER_TEMP/decision.json")"
          safe_changes="$(jq -r '.safe_changes_present' "$RUNNER_TEMP/decision.json")"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "safe_changes=$safe_changes" >> "$GITHUB_OUTPUT"
          jq '{outcome, confidence_score, confidence_band, criticality, awaiting_human}' "$RUNNER_TEMP/decision.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether an open PR already covers this task
        id: coverage
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success' && steps.triage.outputs.safe_changes == 'true' && steps.select.outputs.mode != 'rework' && steps.select.outputs.outcome != 'artifact'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPR_SCOPE_DEDUPE_MODE: enforce
        run: |
          "$AUTOPR_CONTROL_ROOT/autopr-scope/check-open-prs.sh" \
            --lane kanban --identity "$(jq -r '.task_id' "$RUNNER_TEMP/card.json")" \
            --evidence "$RUNNER_TEMP/card.json" --report "$RUNNER_TEMP/report.md" \
            --output "$RUNNER_TEMP/coverage.json"
          jq . "$RUNNER_TEMP/coverage.json" >> "$GITHUB_STEP_SUMMARY"
          decision="$(jq -r '.decision' "$RUNNER_TEMP/coverage.json")"
          confidence="$(jq -r '.confidence' "$RUNNER_TEMP/coverage.json")"
          mode="$(jq -r '.mode' "$RUNNER_TEMP/coverage.json")"
          if [ "$mode" = enforce ] && [ "$decision" = covered ] && [ "$confidence" = high ]; then
            echo "covered=true" >> "$GITHUB_OUTPUT"
          else
            echo "covered=false" >> "$GITHUB_OUTPUT"
          fi
          [ "$(jq -r '.possible_duplicate' "$RUNNER_TEMP/coverage.json")" != true ] || echo "possible_duplicate=true" >> "$GITHUB_OUTPUT"

      - name: Link task to its covering PR
        if: steps.coverage.outputs.covered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/record-coverage.sh" "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/coverage.json"

      - name: Verify (baseline vs branch)
        id: verify
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success' && steps.triage.outputs.safe_changes == 'true' && steps.coverage.outputs.covered != 'true' && steps.select.outputs.outcome != 'artifact'
        timeout-minutes: 8
        run: |
          "$AUTOPR_CONTROL_ROOT/error-autofix/verify.sh" > "$RUNNER_TEMP/verification.md"
        env:
          AUTOFIX_BASE_SHA: ${{ steps.branch.outputs.sha }}

      - name: Record verification deferred for questions or no-safe-action
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success' && steps.triage.outputs.safe_changes != 'true' && steps.select.outputs.outcome != 'artifact'
        run: |
          printf '%s\n' '## Verification' '' 'Not run: this result contains no product diff and is awaiting requirements or a human-only action.' > "$RUNNER_TEMP/verification.md"

      - name: Write commit subject and card note
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success' && steps.coverage.outputs.covered != 'true' && steps.select.outputs.outcome != 'artifact'
        timeout-minutes: 5
        env:
          AUTOPR_MSANDBOX_BIN: ${{ github.workspace }}/scripts/agent-sandbox.sh
          AUTOPR_SANDBOX_PROJECT_NAME: matcha-kanban-autopr-sandbox
        run: |
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/write-publication-copy.sh" \
            "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/decision.json" \
            "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/verification.md" \
            "$RUNNER_TEMP/publication-copy.json"

      - name: Publish PR, question draft, or no-spec marker
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success' && steps.coverage.outputs.covered != 'true' && steps.select.outputs.outcome != 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPR_POSSIBLE_DUPLICATE: ${{ steps.coverage.outputs.possible_duplicate == 'true' && '1' || '0' }}
        run: |
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/publish.sh" \
            "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/decision.json" \
            "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/verification.md" \
            "$RUNNER_TEMP/publication-copy.json"

      - name: Publish research report
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success' && steps.select.outputs.outcome == 'artifact'
        timeout-minutes: 5
        run: |
          # The default shell here is `bash -e`, not `bash -eo pipefail`: piping
          # the publisher into tee would otherwise report tee's exit status, so
          # a failed publication (report upload 500, non-2xx card PATCH) went
          # green with the card still sitting in Todo.
          set -o pipefail
          # No GH_TOKEN here: a research card owns no branch and no PR. The
          # publisher uploads the report to the card, posts the summary note,
          # and moves the card to Review through the bot's REST identity;
          # the server's task-update path notifies collaborators from there.
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/publish-research.sh" \
            "$RUNNER_TEMP/card.json" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/decision.json" \
            "$RUNNER_TEMP/research-artifacts" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always() && steps.select.outputs.skip == 'false'
        run: |
          # Temporary isolation is allowed while building a PR, but no
          # submitted PR branch may remain checked out on the Mac runner.
          # Dirty state is preserved and reported instead of deleted.
          "$AUTOPR_CONTROL_ROOT/kanban-autopr/leave-task-checkout.sh"
