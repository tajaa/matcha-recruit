name: Post-deploy AutoPR fix verification

on:
  workflow_dispatch:
    inputs:
      deploy_id:
        required: true
        type: string
      deployed_at:
        required: true
        type: string
      target:
        required: true
        type: string
      sha:
        required: true
        type: string
      source:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: post-deploy-autopr-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure production verification labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create production-verified --repo "$GITHUB_REPOSITORY" --force \
            --color 0E8A16 --description 'Reviewed post-deploy production assertions passed'
          gh label create production-verification-needed --repo "$GITHUB_REPOSITORY" --force \
            --color FBCA04 --description 'Deployed fix requires a manual authenticated or visual production check'
          gh label create production-verification-failed --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description 'A reviewed post-deploy production assertion failed'

      - name: Verify deployed AutoPR fixes
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ inputs.sha }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]
          [[ "$DEPLOY_TARGET" =~ ^(backend|frontend|matcha)$ ]]
          set +e
          ./scripts/kanban-autopr/verify-production-fixes.sh \
            "$DEPLOYED_SHA" "$DEPLOY_TARGET" \
            | tee "$RUNNER_TEMP/production-fix-verification.json"
          verify_rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## Post-deploy AutoPR fix verification'
            echo '```json'
            cat "$RUNNER_TEMP/production-fix-verification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$verify_rc"
