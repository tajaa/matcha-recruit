name: PR checks

# deploy.yml deliberately has no pull_request trigger (that workflow's deploy
# leg must never be reachable from a PR), which left zero checks running on
# PRs. Cheap and separate on purpose: no Docker, but it runs the complete
# frontend production build so type and bundling failures cannot merge green.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Backend/scripts syntax check
        run: |
          python -m pip install pytest 'asyncpg>=0.29.0'
          python -m compileall -q server/app server/alembic scripts
          python -m pytest -q scripts/tests/test_ops_health.py scripts/tests/test_operational_integrity.py scripts/tests/test_error_autofix_query.py
          bash -n scripts/update-ec2.sh scripts/ops-health/prod-query.sh scripts/ops-health/publish-issue.sh scripts/ops-health/backup-probe.sh scripts/ops-health/schema-snapshot.sh scripts/error-autofix/decision.sh scripts/error-autofix/investigate.sh scripts/error-autofix/notify-review-ready.sh scripts/error-autofix/publish.sh scripts/error-autofix/reconcile.sh scripts/error-autofix/record-coverage.sh scripts/kanban-autopr/dispatch-if-idle.sh scripts/kanban-autopr/record-coverage.sh scripts/autopr-scope/check-open-prs.sh scripts/autopr-scope/lib.sh scripts/autopr-self-audit/audit.sh scripts/autopr-self-audit/check-decision.sh scripts/autopr-self-audit/investigate.sh scripts/autopr-self-audit/verify.sh scripts/autopr-self-audit/publish.sh scripts/agent-sandbox.sh
          bash scripts/tests/test_ci_guards.sh
          bash scripts/tests/test_agent_sandbox_networking.sh
          bash scripts/tests/test_msandbox_attachments.sh
          bash scripts/tests/test_autopr_self_audit.sh
          bash scripts/tests/test_error_autofix.sh
          bash scripts/tests/test_operational_integrity.sh
          bash scripts/tests/test_publish_issue.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        # --legacy-peer-deps mirrors client/Dockerfile's npm ci: react 19 vs
        # react-simple-maps@3's react<=18 peer range ERESOLVEs otherwise.
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Frontend production build
        # Runs `tsc -b` against project references, then Vite. The bare
        # `npx tsc --noEmit` checks nothing because the root tsconfig has
        # `files: []`.
        run: npm run build
        working-directory: client
