name: PR checks

# deploy.yml deliberately has no pull_request trigger (that workflow's deploy
# leg must never be reachable from a PR), which left zero checks running on
# PRs. This workflow never pushes an image or touches prod: the docker-build
# job below is a build-only smoke test (no registry login, no --push).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Backend/scripts syntax check
        run: |
          python -m pip install pytest 'asyncpg>=0.29.0'
          python -m compileall -q server/app server/alembic scripts
          python -m pytest -q scripts/tests/test_ops_health.py scripts/tests/test_operational_integrity.py scripts/tests/test_error_autofix_query.py scripts/tests/test_admin_updates.py
          bash -n scripts/update-ec2.sh scripts/build-and-push.sh scripts/sync-test-tenants.sh scripts/ops-health/backup-restore-drill.sh scripts/ops-health/prune-merged-bot-branches.sh scripts/admin-updates/collect-prod-state.sh scripts/admin-updates/collect.sh scripts/admin-updates/write-content.sh scripts/admin-updates/publish.sh scripts/ops-health/prod-query.sh scripts/ops-health/publish-issue.sh scripts/ops-health/backup-probe.sh scripts/ops-health/schema-snapshot.sh scripts/error-autofix/decision.sh scripts/error-autofix/investigate.sh scripts/error-autofix/notify-review-ready.sh scripts/error-autofix/publish.sh scripts/error-autofix/reconcile.sh scripts/error-autofix/record-coverage.sh scripts/kanban-autopr/checkpoint.sh scripts/kanban-autopr/dispatch-if-idle.sh scripts/kanban-autopr/investigate.sh scripts/kanban-autopr/publish.sh scripts/kanban-autopr/publish-research.sh scripts/kanban-autopr/decision.sh scripts/kanban-autopr/record-coverage.sh scripts/kanban-autopr/run-codex-sandboxed.sh scripts/kanban-autopr/runtime-policy.sh scripts/kanban-autopr/write-commit-subject.sh scripts/kanban-autopr/write-publication-copy.sh scripts/autopr-scope/check-open-prs.sh scripts/autopr-scope/lib.sh scripts/autopr-self-audit/audit.sh scripts/autopr-self-audit/check-decision.sh scripts/autopr-self-audit/investigate.sh scripts/autopr-self-audit/verify.sh scripts/autopr-self-audit/publish.sh scripts/agent-sandbox.sh scripts/tests/test_admin_updates_collect.sh
          bash scripts/tests/test_admin_updates_collect.sh
          bash scripts/tests/test_ci_guards.sh
          bash scripts/tests/test_agent_sandbox_networking.sh
          bash scripts/tests/test_msandbox_attachments.sh
          bash scripts/tests/test_msandbox_sessions.sh
          bash scripts/tests/test_msandbox_worktrees.sh
          bash scripts/tests/test_autopr_self_audit.sh
          bash scripts/tests/test_error_autofix.sh
          bash scripts/tests/test_operational_integrity.sh
          bash scripts/tests/test_publish_issue.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend deps
        # --legacy-peer-deps mirrors client/Dockerfile's npm ci: react 19 vs
        # react-simple-maps@3's react<=18 peer range ERESOLVEs otherwise.
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Frontend production build
        # Runs `tsc -b` against project references, then Vite. The bare
        # `npx tsc --noEmit` checks nothing because the root tsconfig has
        # `files: []`.
        run: npm run build
        working-directory: client

      - name: Frontend unit tests
        # Main has one exact known assertion failure. Accept only that
        # fingerprint; any additional or different failure makes CI red.
        run: |
          set +e
          npm run test:run -- --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" \
            >"$RUNNER_TEMP/vitest.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/vitest.log"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          python - "$RUNNER_TEMP/vitest.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          failed_results = [
              result for result in report.get("testResults", [])
              if result.get("status") == "failed"
          ]
          failed = [
              (result["name"], assertion["fullName"])
              for result in report.get("testResults", [])
              for assertion in result.get("assertionResults", [])
              if assertion.get("status") == "failed"
          ]
          expected = [(
              "src/data/featureCatalog.test.ts",
              "applyFeatureToggle disables dependent features without disabling unrelated prerequisites",
          )]
          normalized = [(name.replace("\\", "/"), title) for name, title in failed]
          summary_matches = (
              report.get("numFailedTests") == 1
              and len(failed_results) == 1
          )
          if not summary_matches or len(normalized) != 1 or not normalized[0][0].endswith(expected[0][0]) or normalized[0][1] != expected[0][1]:
              raise SystemExit(f"unexpected Vitest failures: {failed!r}")
          print("Accepted the one exact main-branch Vitest baseline failure.")
          PY
        working-directory: client

      - name: Tellus production build
        run: |
          npm ci --legacy-peer-deps
          npm run build
        working-directory: client/tellus

      - name: Oceanlab lint and production build
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run build
        working-directory: client/oceanlab

  server-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matcha
          POSTGRES_PASSWORD: matcha_test
          POSTGRES_DB: matcha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matcha -d matcha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://matcha:matcha_test@127.0.0.1:5432/matcha_test
      REDIS_URL: redis://127.0.0.1:6379/0
      OPENSSL_armcap: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server test environment
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
        working-directory: server
      - name: Apply isolated test migrations
        id: migrations
        # Fresh-database migration ordering is red on main. Accept only the
        # exact known revision/relation failure; drift or a new failure is red.
        run: |
          set +e
          python -m alembic upgrade heads >"$RUNNER_TEMP/migrations.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/migrations.log"
          if [ "$rc" -eq 0 ]; then
            echo 'schema_ready=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q '7c1de748641e' "$RUNNER_TEMP/migrations.log"
          grep -q 'relation "companies" does not exist' "$RUNNER_TEMP/migrations.log"
          echo 'schema_ready=false' >> "$GITHUB_OUTPUT"
          echo "Accepted the exact main-branch fresh-migration baseline failure."
        working-directory: server
      - name: Server test suite
        # The known migration failure leaves an incomplete schema. Until it is
        # repaired, still collect all other 7k+ tests to catch import errors;
        # once migrations pass, execute them normally.
        run: |
          args=(-q tests app/oceanlab/tests --ignore=tests/employees/test_internal_mobility_routes.py)
          if [ '${{ steps.migrations.outputs.schema_ready }}' = true ]; then
            python -m pytest "${args[@]}"
          else
            python -m pytest --collect-only "${args[@]}"
          fi
        working-directory: server
      - name: Internal mobility test baseline
        # Run this file separately. If its stale import is repaired, its tests
        # execute normally; otherwise accept only the exact main failure.
        run: |
          set +e
          python -m pytest -q tests/employees/test_internal_mobility_routes.py \
            >"$RUNNER_TEMP/pytest-internal-mobility.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/pytest-internal-mobility.log"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          test "$(grep -c '^ERROR tests/employees/test_internal_mobility_routes.py$' "$RUNNER_TEMP/pytest-internal-mobility.log")" -eq 1
          grep -q "cannot import name 'internal_mobility' from 'app.matcha.routes'" "$RUNNER_TEMP/pytest-internal-mobility.log"
          grep -q 'Interrupted: 1 error during collection' "$RUNNER_TEMP/pytest-internal-mobility.log"
          echo "Accepted the exact main-branch server collection baseline failure."
        working-directory: server

  native-builds:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build affected Xcode projects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # HEAD is the PR merge commit: ^1 = the main tip it was built on,
          # ^2 = the PR head. Diffing those (not the event's base.sha, which
          # goes stale when main moves after the event) yields only PR changes.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=HEAD^1; head=HEAD^2; else base="$BASE_SHA"; head=HEAD; fi
          changed="$(git diff --name-only "$base"..."$head")"
          ran=0
          if grep -q '^platforms/desktop/Espresso/' <<< "$changed"; then
            ./scripts/xcode-build.sh espresso build
            ran=1
          fi
          if grep -q '^platforms/ios/MatchaTutor/' <<< "$changed"; then
            ./scripts/xcode-build.sh matchatutor build
            ran=1
          fi
          if grep -q '^platforms/ios/TellUs/' <<< "$changed"; then
            ./scripts/xcode-build.sh tellus build
            ran=1
          fi
          if grep -q '^platforms/ios/Gummfit/' <<< "$changed"; then
            ./scripts/xcode-build.sh gummfit build
            ran=1
          fi
          if [ "$ran" = 0 ]; then echo "No native project changed."; fi

  lint:
    # Incremental on purpose: main carries ~490 eslint findings and 16 real
    # ruff undefined-name errors, so a whole-tree gate would be red forever.
    # Files touched by the PR must be clean; untouched debt stays untouched.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Collect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # HEAD is the PR merge commit (^1 = main tip it was built on, ^2 =
          # PR head). The event's base.sha goes stale when main moves after
          # the event and then drags main's own commits into "changed".
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=HEAD^1; head=HEAD^2; else base="$BASE_SHA"; head=HEAD; fi
          git rev-parse "$base" > "$RUNNER_TEMP/base-sha.txt"
          git diff --name-only --diff-filter=ACMR "$base"..."$head" > "$RUNNER_TEMP/changed.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
          { grep -E '^(server/(app|alembic|scripts)/|scripts/).*\.py$' "$RUNNER_TEMP/changed.txt" || true; } > "$RUNNER_TEMP/changed-py.txt"
          { grep -E '^client/src/.*\.(ts|tsx)$' "$RUNNER_TEMP/changed.txt" || true; } > "$RUNNER_TEMP/changed-ts.txt"
          { grep -E '^\.github/workflows/.*\.ya?ml$' "$RUNNER_TEMP/changed.txt" || true; } > "$RUNNER_TEMP/changed-wf.txt"
          { grep -E '^server/alembic/versions/.*\.py$' "$RUNNER_TEMP/changed.txt" || true; } > "$RUNNER_TEMP/changed-migrations.txt"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: ruff on changed Python files
        # Only the fatal subset (syntax errors, undefined names, misuse of
        # assert/return) — the things that are already runtime bugs.
        run: |
          if [ ! -s "$RUNNER_TEMP/changed-py.txt" ]; then echo "No Python changes."; exit 0; fi
          python -m pip install -q ruff==0.16.6
          xargs -a "$RUNNER_TEMP/changed-py.txt" ruff check --no-cache --target-version py312 --select E9,F63,F7,F82 --output-format github

      - name: Alembic head guard
        # The repo runs multiple intentional heads. A PR must not ADD one: a
        # new migration has to chain off an existing head, otherwise dev and
        # prod each end up applying it against a different graph.
        run: |
          if [ ! -s "$RUNNER_TEMP/changed-migrations.txt" ]; then echo "No migration changes."; exit 0; fi
          base_dir="$(mktemp -d)"
          git archive "$(cat "$RUNNER_TEMP/base-sha.txt")" server/alembic/versions | tar -x -C "$base_dir"
          python3 scripts/alembic_graph.py heads --versions "$base_dir/server/alembic/versions" | sort > "$RUNNER_TEMP/heads-base.txt"
          python3 scripts/alembic_graph.py heads | sort > "$RUNNER_TEMP/heads-pr.txt"
          base_n="$(wc -l < "$RUNNER_TEMP/heads-base.txt")"
          pr_n="$(wc -l < "$RUNNER_TEMP/heads-pr.txt")"
          echo "heads on base: $base_n, on PR: $pr_n"
          if [ "$pr_n" -gt "$base_n" ]; then
            echo "::error::This PR adds a new Alembic head ($base_n -> $pr_n). New migrations must set down_revision to an existing head:"
            comm -13 "$RUNNER_TEMP/heads-base.txt" "$RUNNER_TEMP/heads-pr.txt"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: hashFiles('client/package-lock.json') != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: eslint on changed client files
        run: |
          if [ ! -s "$RUNNER_TEMP/changed-ts.txt" ]; then echo "No client TS changes."; exit 0; fi
          npm ci --legacy-peer-deps
          # Paths are repo-relative; eslint runs from client/.
          sed 's#^client/##' "$RUNNER_TEMP/changed-ts.txt" | xargs npx eslint --no-warn-ignored
        working-directory: client

      - name: actionlint on changed workflows
        # Every workflow here SHA-pins actions and several write the prod SSH
        # key to disk; a typo'd expression or an unquoted input is the kind of
        # thing that only shows up on the next deploy otherwise.
        run: |
          if [ ! -s "$RUNNER_TEMP/changed-wf.txt" ]; then echo "No workflow changes."; exit 0; fi
          # SHELLCHECK_OPTS raises the floor to warning+: the older workflows
          # carry SC2129-style nits not worth a red check; real quoting bugs
          # are warnings and still fail.
          docker run --rm -e SHELLCHECK_OPTS='-S warning' -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  docker-build:
    # Build-only smoke test of the two images build-and-push.sh ships. No
    # registry, no push, no credentials — it exists so a Dockerfile / lockfile
    # / requirements break surfaces on the PR instead of on the deploy runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide which images changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Same merge-commit parent diff as the lint job — see its comment.
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=HEAD^1; head=HEAD^2; else base="$BASE_SHA"; head=HEAD; fi
          changed="$(git diff --name-only "$base"..."$head")"
          backend=false; frontend=false
          # server/ minus what server/.dockerignore leaves out of the image.
          if grep -E '^server/' <<< "$changed" | grep -vqE '^server/(tests|agent|agent-ui)/|\.md$'; then backend=true; fi
          if grep -qE '^client/' <<< "$changed"; then frontend=true; fi
          if grep -qE '^\.github/workflows/ci\.yml$' <<< "$changed"; then backend=true; frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.frontend == 'true'

      - name: Build backend image
        if: steps.changed.outputs.backend == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=ci-backend \
            --cache-to type=gha,mode=max,scope=ci-backend \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -f server/Dockerfile server

      - name: Build frontend image
        if: steps.changed.outputs.frontend == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=ci-frontend \
            --cache-to type=gha,mode=max,scope=ci-frontend \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg VITE_LANDING_BUILD_VERSION=0 \
            -f client/Dockerfile client
