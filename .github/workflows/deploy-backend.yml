name: Deploy Backend

# Manual only. Backend-only patch path — no target dropdown, no frontend/matcha
# option. Same swap as deploy.yml's target=backend, just a dedicated,
# unambiguous entry in the Actions tab for quick backend fixes.
# Trigger: Actions tab / GitHub mobile app / `gh workflow run deploy-backend.yml`
on:
  workflow_dispatch:
    inputs:
      hotfix:
        description: "Hotfix mode — pull + swap only (skip nginx sync, backup, pruning; 5s worker stop)"
        type: boolean
        default: true
      allow_pending_migrations:
        description: "Deploy even if prod alembic_version is missing migrations from this ref (normally blocked — run migrate-prod.sh first)"
        type: boolean
        default: false

# Shares the deploy.yml concurrency group — same group name means GitHub
# serializes across both workflows, so a backend-only run never races a
# matcha/frontend run's swap.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  AWS_ACCOUNT_ID: "010438494410"

jobs:
  build:
    name: Build and Push Backend Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      id-token: write   # OIDC -> AWS_ROLE_ARN (ECR push only)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push (backend only)
        run: |
          chmod +x ./scripts/build-and-push.sh
          ./scripts/build-and-push.sh --backend-only

  deploy:
    name: Blue-green deploy backend to EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Write SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ec2.pem"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2.pem"

      - name: Deploy (update-ec2.sh --backend, verbatim laptop path)
        env:
          SSH_KEY: ${{ runner.temp }}/ec2.pem
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./scripts/update-ec2.sh
          flags=(--backend)
          if [ "${{ inputs.hotfix }}" = "true" ]; then
            flags+=(--hotfix)
          fi
          if [ "${{ inputs.allow_pending_migrations }}" = "true" ]; then
            flags+=(--allow-pending-migrations)
          fi
          ./scripts/update-ec2.sh "${flags[@]}"
