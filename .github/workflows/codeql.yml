name: CodeQL

# Static analysis for the Python backends and the TypeScript frontends.
# Separate from ci.yml so a slow analysis never gates the fast PR checks;
# results land in the Security tab, and PR runs annotate new alerts inline.
on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "scripts/**/*.py"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly full scan of main regardless of PR activity.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Generated/vendored trees are noise, not code we own.
          config: |
            paths-ignore:
              - client/src/generated
              - client/dist
              - "**/node_modules"
              - server/venv
              - server/agent/static

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
