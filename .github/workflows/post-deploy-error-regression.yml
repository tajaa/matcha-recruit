name: Post-deploy error regression

on:
  workflow_dispatch:
    inputs:
      deploy_id:
        description: "Unique deployment identifier"
        required: true
        type: string
      deployed_at:
        description: "UTC ISO-8601 deployment completion time"
        required: true
        type: string
      target:
        description: "Deployment target"
        required: true
        type: string
      sha:
        description: "Deployed source SHA"
        required: true
        type: string
      source:
        description: "github or laptop"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy-prod
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Write production SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/matcha-prod.pem"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/matcha-prod.pem"

      - name: Capture baseline error snapshot
        id: baseline
        continue-on-error: true
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
        run: ./scripts/ops-health/prod-query.sh errors > "$RUNNER_TEMP/errors-before.json"

      - name: Wait for observation window
        if: steps.baseline.outcome == 'success'
        run: |
          deployed_epoch="$(date -u -d '${{ inputs.deployed_at }}' +%s)"
          now_epoch="$(date -u +%s)"
          remaining=$(( deployed_epoch + 900 - now_epoch ))
          if [ "$remaining" -gt 0 ]; then
            echo "Waiting ${remaining}s for the 15-minute post-deploy window."
            sleep "$remaining"
          fi

      - name: Capture final error snapshot
        id: final
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
        run: ./scripts/ops-health/prod-query.sh errors > "$RUNNER_TEMP/errors-after.json"

      - name: Evaluate regression
        id: regression
        if: steps.baseline.outcome == 'success' && steps.final.outcome == 'success'
        continue-on-error: true
        run: |
          python3 scripts/ops-health/error-regression.py \
            --baseline "$RUNNER_TEMP/errors-before.json" \
            --final "$RUNNER_TEMP/errors-after.json" \
            --output "$RUNNER_TEMP/regression.json"

      - name: Publish collection failure
        if: always() && (steps.baseline.outcome != 'success' || steps.final.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'The post-deploy monitor could not collect a read-only production error snapshot.\n\nWorkflow: %s\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/collection-failure.md"
          ./scripts/ops-health/publish-issue.sh ops-health:post-deploy-monitor \
            'ops: post-deploy monitor collection failed' "$RUNNER_TEMP/collection-failure.md" ops-health

      - name: Publish regression issue
        if: steps.regression.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RUNNER_TEMP/regression.json" > "$RUNNER_TEMP/regression.md" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("A production error regression was observed in the first 15 minutes after deployment.\n")
          print("| Key | Error | Source | Path | New occurrences |")
          print("|---|---|---|---|---:|")
          for row in report["changes"]:
              print(f"| `{row['stable_key']}` | {row['exception_type']}: {row['message']} | {row['source']} | `{row['path']}` | {row['delta']} |")
          print("\nOnly normalized messages and query-free paths are included. Inspect the linked Admin Server Errors record for protected context.")
          PY
          ./scripts/ops-health/publish-issue.sh "deploy-regression:${{ inputs.deploy_id }}" \
            'ops: post-deploy error regression' "$RUNNER_TEMP/regression.md" deploy-regression

      - name: Write summary
        if: always()
        run: |
          echo '## Post-deploy error regression' >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy: \\`${{ inputs.deploy_id }}\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \\`${{ inputs.target }}\\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/regression.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/regression.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Error collection did not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark detected regression
        if: always() && (steps.baseline.outcome != 'success' || steps.final.outcome != 'success' || steps.regression.outcome == 'failure')
        run: exit 1

      - name: Delete production SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/matcha-prod.pem"
