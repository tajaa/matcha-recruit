name: Silent error autofix

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# This must run on Finch's Mac. It uses that user's authenticated OpenCode
# profile; no model credential is stored in GitHub.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: silent-error-autofix
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: [self-hosted, macOS, opencode]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reset any stray bot branch from a prior interrupted run
        run: |
          git worktree list --porcelain | awk '/^branch refs\/heads\/bot\/err-/{print}' || true
          git worktree prune
          current="$(git branch --show-current)"
          if [[ "$current" == bot/err-* ]]; then
            git switch main
          fi
          git branch --list 'bot/err-*' | xargs -r -n1 git branch -D || true

      - name: Configure GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for l in "autofix|1D76DB|Opened by the silent-error autofix bot" \
                   "needs-work|D93F0B|Verification found a new test failure" \
                   "autofix-nofix|CFD3D7|Investigated but no safe fix found" \
                   "sev:high|B60205|" "sev:med|D4C5F9|" "sev:low|0E8A16|"; do
            IFS='|' read -r name color desc <<< "$l"
            gh label create "$name" --color "$color" --description "$desc" --force >/dev/null 2>&1 || true
          done

      - name: Write production SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/matcha-prod.pem"
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/matcha-prod.pem"

      - name: Collect unresolved errors from server_error_reports
        id: collect
        timeout-minutes: 3
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
        run: |
          if ./scripts/error-autofix/collect.sh --hours 24 --limit 25 > "$RUNNER_TEMP/incidents.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "DB collection failed; falling back to log-grep evidence" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fallback log-grep evidence
        if: steps.collect.outputs.ok != 'true'
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
          PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
          PROD_API_HEALTH_URL: ${{ vars.PROD_API_HEALTH_URL }}
          EVIDENCE_FILE: ${{ runner.temp }}/silent-error-evidence.txt
        run: |
          ./scripts/collect-silent-error-evidence.sh || true
          if [ ! -s "$RUNNER_TEMP/silent-error-evidence.txt" ]; then
            echo '[]' > "$RUNNER_TEMP/incidents.json"
            exit 0
          fi
          # Keep the fallback actionable: select.sh needs the same incident
          # shape as the DB collector, while the evidence itself is already
          # redacted by collect-silent-error-evidence.sh.
          signature="$(sed -E -e 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ /[TIME] /' -e 's/[0-9]+/[N]/g' "$RUNNER_TEMP/silent-error-evidence.txt" | sort -u | shasum -a 256 | cut -c1-12)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg key "$signature" --arg seen "$now" --rawfile evidence "$RUNNER_TEMP/silent-error-evidence.txt" \
            '[{stable_key: $key, error_id: "", kind: "http_error", level: "ERROR", exception_type: "LogFallback", message: $evidence, traceback: $evidence, source: "log_fallback", request_method: "", request_path: "", request_status: null, occurrences: 1, days_seen: 1, first_seen: $seen, last_seen: $seen, request_id: null, company_id: null}]' \
            > "$RUNNER_TEMP/incidents.json"

      - name: Select one incident
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./scripts/error-autofix/select.sh "$RUNNER_TEMP/incidents.json" > "$RUNNER_TEMP/incident.json"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "Nothing to investigate this run." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            key="$(jq -r '.stable_key' "$RUNNER_TEMP/incident.json")"
            echo "key=$key" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fix branch
        id: branch
        if: steps.select.outputs.skip == 'false'
        run: |
          git worktree prune
          git switch -C "bot/err-${{ steps.select.outputs.key }}" main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch correlated log lines (best-effort, uses prod key)
        if: steps.select.outputs.skip == 'false'
        timeout-minutes: 2
        continue-on-error: true
        env:
          SSH_KEY: ${{ runner.temp }}/matcha-prod.pem
        run: |
          ./scripts/error-autofix/fetch-correlated-log.sh "$RUNNER_TEMP/incident.json" > "$RUNNER_TEMP/correlated-log.txt" || true

      - name: Delete production SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/matcha-prod.pem"

      - name: Investigate
        id: investigate
        if: steps.select.outputs.skip == 'false'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          ./scripts/error-autofix/investigate.sh "$RUNNER_TEMP/incident.json" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/correlated-log.txt"

      - name: No usable investigation — track as issue and stop
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # investigate.sh can die AFTER the model has already edited files
          # (report missing, or a required heading missing — checked only
          # after the model run). Without discarding those partial edits
          # first, publish.sh's `git add --all` would find a real diff and
          # take the PR path instead of the issue path — shipping a
          # possibly-broken, definitely-unreviewed fix under a body that
          # says "Investigation failed."
          git reset --hard HEAD
          git clean -fd
          echo "Investigation failed or produced no report." > "$RUNNER_TEMP/report.md"
          echo "### Verification" > "$RUNNER_TEMP/verification.md"
          echo "_(not run — investigation did not complete)_" >> "$RUNNER_TEMP/verification.md"
          ./scripts/error-autofix/publish.sh "$RUNNER_TEMP/incident.json" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/verification.md"

      - name: Verify (baseline vs branch)
        id: verify
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success'
        timeout-minutes: 8
        run: |
          ./scripts/error-autofix/verify.sh > "$RUNNER_TEMP/verification.md"
        env:
          AUTOFIX_BASE_SHA: ${{ steps.branch.outputs.sha }}

      - name: Publish PR (or no-fix issue)
        if: steps.select.outputs.skip == 'false' && steps.investigate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/error-autofix/publish.sh "$RUNNER_TEMP/incident.json" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/verification.md"

      - name: Cleanup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/matcha-prod.pem"
          git reset --hard >/dev/null 2>&1 || true
          git worktree list --porcelain | awk '/^worktree /{print $2}' | grep -v "^$(git rev-parse --show-toplevel)\$" | xargs -r -n1 git worktree remove --force || true
          git worktree prune || true
          git switch main >/dev/null 2>&1 || true
          if [ -n "${{ steps.select.outputs.key }}" ]; then
            git branch -D "bot/err-${{ steps.select.outputs.key }}" >/dev/null 2>&1 || true
          fi
