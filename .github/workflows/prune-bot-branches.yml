name: Prune merged automation branches

# Deletes bot/* and codex/* branches whose PRs are all closed for 7+ days.
# Human branches (claude/*, matcha/*, feat/*, fix/*, ...) are never touched —
# see scripts/ops-health/prune-merged-bot-branches.sh for the exact rules.
on:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-bot-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          ./scripts/ops-health/prune-merged-bot-branches.sh "${flags[@]}" | tee "$RUNNER_TEMP/prune.log"
          { echo '## Automation branch prune'; echo; echo '```'; cat "$RUNNER_TEMP/prune.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
