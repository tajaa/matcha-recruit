# Ban IPs that rack up 404s — scanners walking /wp-admin, /.env, /phpmyadmin.
#
# Two exemptions, both for the same reason: the path contains something a
# scanner cannot guess, so a 404 there is a real client holding a stale
# reference, never a probe. Everything else still counts.
#
# 1. Vite content-hashed chunks (/assets/PtoAccrual-C3wEVKM4.js). A blue-green
#    deploy retires the old hashes, so a browser tab open across the swap 404s
#    its way through chunk names that no longer exist. Banned the owner out of
#    his own site on 2026-07-14 (81 failures in ~2 minutes) and read as an outage.
#
#    The hash suffix and extension are REQUIRED, and that is the whole point of
#    the rule. Until 2026-07-30 this exempted any path under /assets/, which let
#    a scanner opt out of the jail by prefixing its probe — the log had exactly
#    one /assets/ 404 in it and it was `GET /assets/priv8.php` from a webshell
#    scanner, being ignored. Zero legitimate chunk 404s remained (the SPA
#    self-heal fixed those at the source), so the broad form was protecting the
#    attacker and nobody else. Match the shape Vite actually emits —
#    `[name]-[hash][extname]` — not the directory.
#
# 2. /api/ paths containing a UUID (2026-07-30). A deleted matcha-work project
#    stays in the Espresso client's detail-VM cache, and every re-open fires TWO
#    404s: GET .../projects/<uuid>/bundle, then the legacy GET .../projects/<uuid>
#    fallback, because the bundle call's `catch` cannot tell "endpoint missing on
#    an old server" from "project deleted". Two dead projects reached maxretry in
#    seconds. The team NATs out of one address, so a single stale desktop tab
#    banned the entire office at once — and a ban REJECTs with icmp-port-unreachable,
#    so it surfaces as "Lost connection to the server", indistinguishable from a
#    real outage while the site serves everyone else fine.
#
#    Bare /api/ 404s with no UUID (/api/v1/users, /api/.env) still count — that
#    IS probe-shaped traffic. Only an unguessable id buys the exemption.
[Definition]
failregex = ^<HOST> -.*" (404|444) .*$
ignoreregex = ^<HOST> -.*"(GET|HEAD) /assets/[^"?\s]*-[A-Za-z0-9_-]{8,}\.(js|css|map|json|wasm|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|mp4|webm)(\?[^"\s]*)?( HTTP/[0-9.]+)?" 404 .*$
              ^<HOST> -.*"(GET|HEAD|POST|PUT|PATCH|DELETE) /api/[^"]*[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}[^"]*" 404 .*$
