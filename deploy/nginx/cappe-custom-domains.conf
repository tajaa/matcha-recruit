# Cappe custom domains (tenant-owned hostnames) — the :443 default_server.
#
# Public TLS for these hosts terminates at CloudFront: each custom domain is a
# *distribution tenant* with its own CloudFront-managed certificate (see
# docs/ops/CAPPE_CUSTOM_DOMAINS.md). CloudFront then reaches this origin over
# `origin.gummfit.com`, so the only certificate nginx presents here is the
# gummfit wildcard — the viewer never sees it.
#
# Why default_server: nginx answers an unmatched SNI with the FIRST server
# block on the port, which was cappe.conf's gummfit apex. A tenant domain
# therefore got the gummfit certificate AND the gummfit SPA. Declaring this
# block `default_server` with `server_name _` makes the fallback explicit and
# routes it to the renderer, which resolves the Host against
# cappe_sites.custom_domain and 404s anything it does not serve.
#
# Upstreams are the blue/green `matcha_frontend` / `matcha_backend` groups
# defined in matcha.conf — NEVER hardcode 8082/8083/8002/8003 here.
#
# BEFORE first install, check the host for another default_server on :443
# (`sudo grep -rn default_server /etc/nginx/`). nginx allows exactly one per
# listen address, and a second one fails `nginx -t` — which now aborts the whole
# deploy. There is deliberately no `listen 80 default_server` block here: the
# stock nginx.conf on this host family ships one, CloudFront redirects viewers
# to HTTPS at the edge, and it reaches this origin https-only.

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Same origin gate as every other Cappe block: a request that did not come
    # through CloudFront (no valid X-Cappe-Origin-Verify) is refused here.
    include /etc/nginx/snippets/cappe-cloudfront-origin-gate.conf;

    # CloudFront's origin SNI is origin.gummfit.com, covered by this wildcard.
    ssl_certificate     /etc/lego/certificates/gummfit.com.crt;
    ssl_certificate_key /etc/lego/certificates/gummfit.com.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Same limit wiring as cappe.conf's wildcard block, and the same rule:
    # error_page at server level ONLY — one error_page inside a location
    # silently drops every other handler for that location.
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @rate_limited;

    limit_conn matcha_conn 30;
    proxy_connect_timeout 5s;

    location ~ ^/api/cappe/public/sites/[^/]+/booking-suggestions$ {
        limit_req zone=matcha_api burst=2 nodelay;
        limit_conn matcha_conn 3;
        client_max_body_size 8k;
        client_body_timeout 10s;
        proxy_pass http://matcha_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/api/cappe/public/sites/[^/]+/booking-suggestions/access(?:/redeem)?$ {
        limit_req zone=matcha_api burst=5 nodelay;
        limit_conn matcha_conn 3;
        client_max_body_size 8k;
        client_body_timeout 10s;
        proxy_pass http://matcha_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # nginx named locations do not cross server{} boundaries, so this is a copy
    # of cappe.conf's handler rather than a reference to it.
    location @rate_limited {
        add_header Retry-After "30" always;
        if ($request_uri ~ ^/api/) {
            add_header Content-Type "application/json" always;
            add_header Retry-After "30" always;
            return 429 '{"detail":"Too many requests. Please try again in a moment."}';
        }
        return 429;
    }

    location / {
        limit_req zone=matcha_api burst=40 nodelay;
        proxy_pass http://matcha_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;          # CRITICAL — renderer routes on Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
