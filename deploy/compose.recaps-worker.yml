# Run on separate compute, never as an extra service on the sized app host.
# Supply a restricted env file: DB, broker, private storage and recap settings.
# It must not include Gmail/Calendar/provider credentials or user sessions.
services:
  espresso-recaps-worker:
    image: ${ESPRESSO_RECAPS_IMAGE:?Set the immutable media image digest}
    env_file: ${ESPRESSO_RECAPS_ENV_FILE:?Set the restricted media environment file}
    command: [celery, -A, app.workers.celery_app, worker, --pool=solo, -Q, espresso_recaps_render, --concurrency=1, --loglevel=info]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      ESPRESSO_RECAPS_WORKER: '1'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 250s
