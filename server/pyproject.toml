[project]
name = "server"
version = "0.1.0"
description = "oceanlab v1 — digital label platform server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
    "pillow>=10.4",
    "openpyxl>=3.1",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations: long op.f(...) lines aren't worth hand-wrapping.
"alembic/versions/*.py" = ["E501"]
