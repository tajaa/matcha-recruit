# Minimal, deliberately not a pyproject.toml: adding one to server/ would give
# pip a project file to interpret (same reasoning as .coveragerc's header).
#
# This exists for one reason: pytest-asyncio's behaviour is configured HERE and
# nowhere else, and until now server/ had no ini file at all — so both settings
# below were whatever the installed version happened to default to.
# requirements-dev.txt allows >=0.23,<2, which spans the 0.x -> 1.0 boundary,
# and 1.x is what actually installs today. Pinning them means a version bump
# cannot silently change how ~155 test modules' `@pytest.mark.asyncio` tests
# are collected or which loop their fixtures get.
[pytest]
# Explicit markers only — no implicit collection of bare `async def` tests.
asyncio_mode = strict
# 1.x warns when this is unset and reserves the right to change the default.
asyncio_default_fixture_loop_scope = function
