name: Gummfit
options:
  bundleIdPrefix: com.gummcap
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5D6TJVCPBK
    CODE_SIGN_STYLE: Automatic

targets:
  Gummfit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Resources
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gummfit
        # Required by App Store validation for any app built against the iOS 11+
        # SDK. actool only auto-injects this when Xcode generates the Info.plist
        # itself; XcodeGen writes a fully-specified one, so it has to be stated
        # here or upload fails with "Missing Info.plist value ... CFBundleIconName".
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gummcap.app
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Archive with an App Store distribution profile. Automatic signing
        # falls back to a development profile when the team has no registered
        # devices, which makes generic archives fail before export.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Gummfit App Store"
    entitlements:
      path: Gummfit.entitlements
  GummfitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Gummfit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gummcap.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Gummfit:
    build:
      targets:
        Gummfit: all
        GummfitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GummfitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
