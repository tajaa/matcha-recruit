name: TellUs
options:
  bundleIdPrefix: com.beetlejuse
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "11"
    DEVELOPMENT_TEAM: 5D6TJVCPBK
    CODE_SIGN_STYLE: Automatic

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  TellUs:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Resources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/FlyerDesigner
      - path: Resources/Fonts
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Beetlejuse
        UIAppFonts:
          - Inter.ttf
        # Required by App Store validation for any app built against the iOS 11+
        # SDK. actool only auto-injects this when Xcode generates the Info.plist
        # itself; XcodeGen writes a fully-specified one, so it has to be stated
        # here or upload fails with "Missing Info.plist value ... CFBundleIconName".
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Beetlejuse uses the camera to scan feedback and reward QR codes, and to take photos for your feedback."
        GIDClientID: "62787429179-qskffndotvi3hqpnu12oeigjaojd3402.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.62787429179-qskffndotvi3hqpnu12oeigjaojd3402"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetlejuse.app
        INFOPLIST_FILE: Info.plist
        # Keep entitlements as authored files. XcodeGen's `entitlements.path`
        # regenerates its target file and would erase the APNs environment key.
        CODE_SIGN_ENTITLEMENTS: TellUs.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Release/archive uses MANUAL signing against an explicit App Store
        # profile. Automatic signing can't work here: it provisions the
        # archive with a *development* profile (only re-signing for
        # distribution at -exportArchive), and a development profile requires
        # at least one device registered to the team — this release account
        # has zero, so it fails with "Your team has no devices from which to
        # generate a provisioning profile". Pinning CODE_SIGN_IDENTITY while
        # leaving style Automatic doesn't help either; Xcode rejects that as
        # "conflicting provisioning settings".
        #
        # Scoped to this target so the SwiftPM dependency targets (GoogleSignIn,
        # AppAuth, …), which are always automatically dev-signed, are untouched
        # — the same setting passed on the xcodebuild command line hits every
        # target and breaks all of them. Scoped to Release so Debug simulator
        # builds (./run.sh) keep using automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Beetlejuse App Store"
          # Push uses the production APNs environment in App Store/TestFlight
          # builds; the base TellUs.entitlements keeps `development` for Debug.
          CODE_SIGN_ENTITLEMENTS: TellUs-Release.entitlements
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
  TellUsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: TellUs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beetlejuse.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TellUs:
    build:
      targets:
        TellUs: all
        TellUsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TellUsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
