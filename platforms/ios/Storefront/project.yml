name: Storefront
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "59"
    DEVELOPMENT_TEAM: 5D6TJVCPBK
    CODE_SIGN_STYLE: Automatic
targets:
  Ahnimal:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahnimal.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Storefront-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Storefront-Release.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ahnimal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CappeAPIBase: https://gummfit.com/api/cappe
        CappeSiteSlug: ahnimal
        CappeSiteOrigin: https://ahnimal.gummfit.com
        AppURLScheme: ahnimal
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ahnimal]
            CFBundleURLName: com.ahnimal.app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  StorefrontTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Ahnimal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahnimal.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ahnimal:
    build:
      targets:
        Ahnimal: all
    test:
      targets: [StorefrontTests]
