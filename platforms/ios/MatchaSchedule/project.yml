name: MatchaSchedule
options:
  bundleIdPrefix: com.heymatcha
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5D6TJVCPBK
    CODE_SIGN_STYLE: Automatic
targets:
  MatchaSchedule:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Matcha Schedule
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.heymatcha.schedule
            CFBundleURLSchemes: [matchaschedule]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heymatcha.schedule
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: MatchaSchedule-Debug.entitlements
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Matcha Schedule App Store
          CODE_SIGN_ENTITLEMENTS: MatchaSchedule-Release.entitlements
  MatchaScheduleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: MatchaSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heymatcha.schedule.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MatchaSchedule:
    build:
      targets:
        MatchaSchedule: all
        MatchaScheduleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MatchaScheduleTests]
    archive:
      config: Release
