name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: matcha
          POSTGRES_PASSWORD: matcha_dev
          POSTGRES_DB: oceanlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matcha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://matcha:matcha_dev@127.0.0.1:5432/oceanlab
      OCEANLAB_TOKEN: ci-test-token
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Create test database
        run: PGPASSWORD=matcha_dev psql -h 127.0.0.1 -U matcha -d postgres -c "CREATE DATABASE oceanlab_test"

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
